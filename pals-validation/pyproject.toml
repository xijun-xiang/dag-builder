[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pals-validation"
version = "0.1.2"
description = "Frozen GPQA-Diamond and HumanEval PALS E1/E2 validation protocols"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = ["torch>=2.4,<3", "transformers>=4.46,<6", "accelerate>=1,<2", "sentencepiece>=0.2"]

[project.scripts]
pals-validation = "pals_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
